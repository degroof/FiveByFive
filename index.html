<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x5 Word Puzzle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <h1 id="gameName">5x5 Word Puzzle</h1>
                <div class="game-info">
                    <span id="gameNumber">Game #1</span>
                </div>
            </div>
            
            <!-- Instructions Section (Collapsible) -->
            <div class="instructions-section">
                <button class="instructions-toggle" id="instructionsToggle">📖 Instructions</button>
                <div class="instructions-content" id="instructionsContent" style="display: none;">
                    <p>Form six 5-letter words using the tiles below:</p>
                    <ul>
                        <li>Three words in rows 0, 2, and 4</li>
                        <li>Three words in columns 0, 2, and 4</li>
                    </ul>
                    <p>Drag and drop tiles onto the white squares of the grid.</p>
                </div>
            </div>
        </header>

        <!-- Game Board Section -->
        <main class="game-board-container">
            <!-- 5x5 Grid -->
            <div class="grid" id="gameGrid">
                <!-- Grid squares will be generated by JavaScript -->
            </div>

            <!-- Tile Rack -->
            <div class="tile-rack" id="tileRack">
                <!-- Tiles will be generated by JavaScript -->
            </div>
        </main>

        <!-- Button Bar -->
        <div class="button-bar" id="buttonBar">
            <button class="game-button" id="giveUpBtn" style="display: none;">GIVE UP</button>
            <button class="game-button" id="peekBtn" style="display: none;">PEEK</button>
            <button class="game-button" id="shareBtn" style="display: none;">SHARE</button>
        </div>
    </div>

    <!-- Hidden area to store peek state -->
    <div id="peekBackup" style="display: none;"></div>

    <script src="grids.js"></script>
    <script src="game.js"></script>
</body>
</html>
